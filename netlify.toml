# ZS TECH — Netlify monorepo deployment
# Frontend is built from /frontend; the Express API is served as a Netlify Function.

[build]
  command = "npm install && npm run build"
  publish = "frontend/dist"

[functions]
  directory = "netlify/functions"

# Route all API calls to the Express wrapper function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
